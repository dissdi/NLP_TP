name: nlp-tp
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  # --- HTTP / 파싱 (conda-forge wheel 더 안정) ---
  - requests>=2.31
  - beautifulsoup4>=4.12
  - lxml>=5.0
  # --- 데이터 처리 ---
  - pandas>=2.0
  - tqdm>=4.66
  # --- Phase C 04_index ---
  # faiss-cpu는 conda-forge가 더 안정 (특히 macOS)
  - faiss-cpu>=1.7
  - pyarrow>=14.0
  - pip:
      # --- 문서 추출 ---
      - pdfplumber>=0.10
      - pyhwp>=0.1b15
      # --- 동적 페이지 (어댑터 F · sprint2 dorm_js·dstat) ---
      # 설치 후: python -m playwright install chromium
      - playwright>=1.40
      # --- 보조 ---
      - jsonlines>=4.0
      # --- Phase C 04_index ---
      - rank_bm25>=0.2.2
      - kiwipiepy>=0.20
      - sentence-transformers>=2.7

# 시스템 의존성 (Colab 또는 Linux 로컬):
#   apt-get install -y libreoffice    # HWP→PDF 폴백 (옵션 a)
#   python -m playwright install chromium
# GPU 사용 시 (연구실 서버):
#   conda install -c pytorch -c nvidia pytorch pytorch-cuda=12.1
#   (또는 시스템 CUDA에 맞는 버전; sentence-transformers는 자동으로 GPU 감지)
