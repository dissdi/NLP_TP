name: nlp-tp
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  # --- HTTP / 파싱 (conda-forge wheel 더 안정) ---
  - requests>=2.31
  - beautifulsoup4>=4.12
  - lxml>=5.0
  # --- 데이터 처리 ---
  - pandas>=2.0
  - tqdm>=4.66
  - pip:
      # --- 문서 추출 ---
      - pdfplumber>=0.10
      - pyhwp>=0.1b15
      # --- 동적 페이지 (어댑터 F · sprint2 dorm_js·dstat) ---
      # 설치 후: python -m playwright install chromium
      - playwright>=1.40
      # --- 보조 ---
      - jsonlines>=4.0

